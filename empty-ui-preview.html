<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty UI</title>
<style>
  :root { --bg: #0b0a10; --fg: #cfc6ad; --line: #3a3550; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.3 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  nav button { background: #1a1726; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  nav button:hover { border-color: #6c5fa8; }
  iframe { flex: 1; width: 100%; border: 0; }
</style></head>
<body>
<nav>
  <button data-go="menu">Menu</button>
  <button data-go="board">Board</button>
  <button data-go="pick">Pick of three</button>
  <button data-go="reward">Reward grid</button>
  <button data-go="shop">Shop</button>
</nav>
<iframe id="g" src="index.html?blank"></iframe>
<script>
  // The game page carries every screen; ?blank (js/blank-ui.js) hides the text
  // and these buttons ask it to open a screen.
  document.querySelectorAll('nav button').forEach(b => b.onclick = () =>
    document.getElementById('g').contentWindow.postMessage({ blankGo: b.dataset.go }, '*'));
</script>
</body></html>
